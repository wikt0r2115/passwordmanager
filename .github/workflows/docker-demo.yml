name: Docker demo

on:
  push:
    branches: [main, master, codex/passwordmanager-docker-demo]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build image and run Maven tests
        run: docker compose build
      - name: Test interactive commands and persistent vault
        run: python3 scripts/smoke-docker.py
