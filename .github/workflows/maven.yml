name: Build and smoke release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test through Maven Wrapper
        run: bash scripts/package-release.sh
      - name: Verify checksum and installed archive
        run: |
          cd dist
          sha256sum -c passwordmanager-1.0.0.zip.sha256
          cd ..
          python3 scripts/smoke-release.py dist/passwordmanager-1.0.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: passwordmanager-1.0.0
          path: |
            dist/passwordmanager-1.0.0.zip
            dist/passwordmanager-1.0.0.zip.sha256

  windows-launcher:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: passwordmanager-1.0.0
          path: release-download
      - name: Run packaged launcher outside checkout and in spaced path
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'release path with spaces'
          New-Item -ItemType Directory -Path $root | Out-Null
          Expand-Archive release-download/passwordmanager-1.0.0.zip -DestinationPath $root
          Set-Location $env:RUNNER_TEMP
          & "$root/passwordmanager-1.0.0/passwordmanager.bat" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$root/passwordmanager-1.0.0/passwordmanager.bat" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  macos-launcher:
    needs: package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: passwordmanager-1.0.0
          path: release-download
      - name: Run packaged launcher outside checkout and in spaced path
        run: |
          mkdir -p "$RUNNER_TEMP/release path with spaces"
          unzip -q release-download/passwordmanager-1.0.0.zip -d "$RUNNER_TEMP/release path with spaces"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release path with spaces/passwordmanager-1.0.0/passwordmanager.sh" --help
          "$RUNNER_TEMP/release path with spaces/passwordmanager-1.0.0/passwordmanager.sh" --version

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, windows-launcher, macos-launcher]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: passwordmanager-1.0.0
          path: release-download
      - name: Publish tested archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-download/passwordmanager-1.0.0.zip release-download/passwordmanager-1.0.0.zip.sha256 \
            --title "passwordmanager v1.0.0" --notes-file CHANGELOG.md --verify-tag
